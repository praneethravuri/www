version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      next-ecosystem:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
          - "eslint-config-next"
      tailwind-ecosystem:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "postcss"
      dev-tooling:
        patterns:
          - "prettier*"
          - "eslint*"
          - "husky"
          - "lint-staged"
          - "typescript"
          - "@types/*"
    ignore:
      # TS 7 is the Go-native port; Next.js 16.x can't detect it (build fails).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 breaks eslint-plugin-react via eslint-config-next 16.x.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (prod deps)
        run: pnpm audit --prod --audit-level=high

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: SEO regression checks
        run: pnpm test:seo

      - name: Security header checks
        run: pnpm test:headers
